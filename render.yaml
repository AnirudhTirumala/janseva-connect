# Render Blueprint for JanSeva Connect - FREE deployment

databases:
  - name: janseva-db
    databaseName: janseva
    user: janseva
    plan: free

services:
  # FastAPI backend
  - type: web
    name: janseva-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

      - key: ENVIRONMENT
        value: production

      - key: STORAGE_PATH
        value: /tmp/janseva

      - key: DATABASE_URL
        fromDatabase:
          name: janseva-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: CORS_ORIGINS
        sync: false

      - key: ALLOWED_HOSTS
        sync: false

      - key: SMTP_HOST
        sync: false

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASSWORD
        sync: false

      - key: SMTP_FROM_NAME
        value: JanSeva Connect

      - key: OTP_EXPIRY_MINUTES
        value: "10"

      - key: GROQ_API_KEY
        sync: false
      
      - key: SEED_ADMIN_EMAIL
        sync: false

      - key: SEED_ADMIN_PASSWORD
        sync: false

  # React/Vite frontend
  - type: web
    name: janseva-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    envVars:
      - key: VITE_API_URL
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY

      - path: /*
        name: X-Content-Type-Options
        value: nosniff

      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin